name: Reusable build

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven
      - run: mvn -B verify
      - uses: actions/upload-artifact@v5
        with:
          name: app-jar
          path: target/*.jar
